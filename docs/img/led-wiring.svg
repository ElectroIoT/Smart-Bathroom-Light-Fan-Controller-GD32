<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<style>.blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }</style>
<rect width="1000" height="560" rx="14" fill="#f6f9ff" stroke="#c9d6ee"/>
<text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#10264d">Status LEDs on the outside of the box</text>
<rect x="20" y="55" width="330" height="395" rx="10" fill="#eef5ff" stroke="#2a62c9" stroke-dasharray="7 4"/>
<text x="35" y="78" font-size="14" font-weight="700" fill="#2a62c9">INSIDE the plastic box</text>
<rect x="350" y="55" width="630" height="395" rx="10" fill="#fff" stroke="#888" stroke-dasharray="7 4"/>
<text x="365" y="78" font-size="14" font-weight="700" fill="#555">OUTSIDE (box lid / front panel)</text>
<rect x="40" y="100" width="100" height="30" rx="5" fill="#d81b60"/><text x="90" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">PA3 (A3)</text>
<line x1="140" y1="115" x2="440" y2="115" stroke="#444" stroke-width="2"/>
<rect x="440" y="105" width="70" height="20" fill="#fff" stroke="#444" stroke-width="2"/><text x="475" y="99" text-anchor="middle" font-size="12" fill="#10264d">330 &#937;</text>
<line x1="510" y1="115" x2="600" y2="115" stroke="#444" stroke-width="2"/>
<circle cx="630" cy="115" r="20" fill="#d81b60" class="blink"/>
<text x="670" y="103" font-size="13" fill="#10264d">PIR  - lit while motion is seen</text>
<line x1="650" y1="115" x2="915" y2="115" stroke="#000" stroke-width="2.5"/>
<rect x="40" y="155" width="100" height="30" rx="5" fill="#f9a825"/><text x="90" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#000">PA4 (A4)</text>
<line x1="140" y1="170" x2="440" y2="170" stroke="#444" stroke-width="2"/>
<rect x="440" y="160" width="70" height="20" fill="#fff" stroke="#444" stroke-width="2"/><text x="475" y="154" text-anchor="middle" font-size="12" fill="#10264d">330 &#937;</text>
<line x1="510" y1="170" x2="600" y2="170" stroke="#444" stroke-width="2"/>
<circle cx="630" cy="170" r="20" fill="#f9a825"/>
<text x="670" y="158" font-size="13" fill="#10264d">LIGHT - lit while the light relay is ON</text>
<line x1="650" y1="170" x2="915" y2="170" stroke="#000" stroke-width="2.5"/>
<rect x="40" y="210" width="100" height="30" rx="5" fill="#00acc1"/><text x="90" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">PA5 (A5)</text>
<line x1="140" y1="225" x2="440" y2="225" stroke="#444" stroke-width="2"/>
<rect x="440" y="215" width="70" height="20" fill="#fff" stroke="#444" stroke-width="2"/><text x="475" y="209" text-anchor="middle" font-size="12" fill="#10264d">330 &#937;</text>
<line x1="510" y1="225" x2="600" y2="225" stroke="#444" stroke-width="2"/>
<circle cx="630" cy="225" r="20" fill="#00acc1"/>
<text x="670" y="213" font-size="13" fill="#10264d">FAN - lit while the fan relay is ON</text>
<line x1="650" y1="225" x2="915" y2="225" stroke="#000" stroke-width="2.5"/>
<rect x="40" y="265" width="100" height="30" rx="5" fill="#e53935"/><text x="90" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">PA6 (A6)</text>
<line x1="140" y1="280" x2="440" y2="280" stroke="#444" stroke-width="2"/>
<rect x="440" y="270" width="70" height="20" fill="#fff" stroke="#444" stroke-width="2"/><text x="475" y="264" text-anchor="middle" font-size="12" fill="#10264d">330 &#937;</text>
<line x1="510" y1="280" x2="600" y2="280" stroke="#444" stroke-width="2"/>
<circle cx="630" cy="280" r="20" fill="#e53935" class="blink"/>
<text x="670" y="268" font-size="13" fill="#10264d">FAULT (red) - fast blink: PIR stuck HIGH</text>
<line x1="650" y1="280" x2="915" y2="280" stroke="#000" stroke-width="2.5"/>
<rect x="40" y="320" width="100" height="30" rx="5" fill="#43a047"/><text x="90" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">PB11 (B11)</text>
<line x1="140" y1="335" x2="440" y2="335" stroke="#444" stroke-width="2"/>
<rect x="440" y="325" width="70" height="20" fill="#fff" stroke="#444" stroke-width="2"/><text x="475" y="319" text-anchor="middle" font-size="12" fill="#10264d">330 &#937;</text>
<line x1="510" y1="335" x2="600" y2="335" stroke="#444" stroke-width="2"/>
<circle cx="630" cy="335" r="20" fill="#43a047"/>
<text x="670" y="323" font-size="13" fill="#10264d">FAN-ENABLED - steady on: fan active</text>
<line x1="650" y1="335" x2="915" y2="335" stroke="#000" stroke-width="2.5"/>
<rect x="40" y="375" width="100" height="30" rx="5" fill="#7dffc4"/><text x="90" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#000">PB13 (B13)</text>
<line x1="140" y1="390" x2="440" y2="390" stroke="#444" stroke-width="2"/>
<rect x="440" y="380" width="70" height="20" fill="#fff" stroke="#444" stroke-width="2"/><text x="475" y="374" text-anchor="middle" font-size="12" fill="#10264d">330 &#937;</text>
<line x1="510" y1="390" x2="600" y2="390" stroke="#444" stroke-width="2"/>
<circle cx="630" cy="390" r="20" fill="#7dffc4" class="blink"/>
<text x="670" y="378" font-size="13" fill="#10264d">SYSTEM heartbeat - blinks once a second</text>
<line x1="650" y1="390" x2="915" y2="390" stroke="#000" stroke-width="2.5"/>
<path d="M140 420 H915 V115" fill="none" stroke="#000" stroke-width="2.5"/>
<text x="35" y="440" font-size="13" fill="#10264d" font-weight="700">GND pin: one common wire to all LEDs</text>
<text x="780" y="412" text-anchor="middle" font-size="12" fill="#000">common GND (LED short legs)</text>
<rect x="20" y="465" width="960" height="80" rx="8" fill="#fff6d6" stroke="#b58900"/>
<text x="35" y="488" font-size="13" fill="#6b4e00" font-weight="700">Notes:</text>
<text x="90" y="488" font-size="13" fill="#6b4e00">LED long leg (anode) on the resistor side, short leg to GND. 330 &#937; for red/green/yellow (100 &#937; for blue/white). A few mA each, no transistor.</text>
<text x="35" y="508" font-size="13" fill="#6b4e00">The board also has its own heartbeat LED on PC13 (on-board). Keep these low-voltage wires away from the 230 V wiring inside the box.</text>
<text x="35" y="528" font-size="13" fill="#6b4e00">Button wiring and the FAN-ENABLED LED: see buttons-wiring.svg. Real pin positions on the board: see pinout.svg.</text>
</svg>