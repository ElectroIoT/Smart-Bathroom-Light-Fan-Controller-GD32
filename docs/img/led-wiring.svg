<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <style>
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }
  </style>
  <rect width="1000" height="470" rx="14" fill="#f6f9ff" stroke="#c9d6ee"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#10264d">Status LEDs on the outside of the box</text>

  <!-- zones -->
  <rect x="20" y="55" width="330" height="330" rx="10" fill="#eef5ff" stroke="#2a62c9" stroke-dasharray="7 4"/>
  <text x="35" y="78" font-size="14" font-weight="700" fill="#2a62c9">INSIDE the plastic box</text>
  <rect x="350" y="55" width="630" height="330" rx="10" fill="#fff" stroke="#888" stroke-dasharray="7 4"/>
  <text x="365" y="78" font-size="14" font-weight="700" fill="#555">OUTSIDE (box lid / front panel)</text>

  <!-- board pins -->
  <g font-size="14" font-weight="700">
    <rect x="40" y="100" width="90" height="30" rx="5" fill="#d81b60"/><text x="85" y="120" text-anchor="middle" fill="#fff">PA3 (A3)</text>
    <rect x="40" y="165" width="90" height="30" rx="5" fill="#f9a825"/><text x="85" y="185" text-anchor="middle" fill="#000">PA4 (A4)</text>
    <rect x="40" y="230" width="90" height="30" rx="5" fill="#00acc1"/><text x="85" y="250" text-anchor="middle" fill="#fff">PA5 (A5)</text>
    <rect x="40" y="295" width="90" height="30" rx="5" fill="#e53935"/><text x="85" y="315" text-anchor="middle" fill="#fff">PA6 (A6)</text>
  </g>
  <text x="40" y="360" font-size="13" fill="#10264d" font-weight="700">GND pin &#8594; one common wire to all LEDs</text>

  <!-- resistors + LEDs, 4 rows -->
  <g font-size="13" fill="#10264d">
    <!-- row helper: y centers 115,180,245,310 -->
    <line x1="130" y1="115" x2="440" y2="115" stroke="#444" stroke-width="2"/>
    <rect x="440" y="105" width="70" height="20" fill="#fff" stroke="#444" stroke-width="2"/><text x="475" y="99" text-anchor="middle">330-1k &#937;</text>
    <line x1="510" y1="115" x2="600" y2="115" stroke="#444" stroke-width="2"/>
    <circle cx="630" cy="115" r="22" fill="#d81b60" class="blink"/><text x="670" y="104">PIR  - lit while motion is seen</text>

    <line x1="130" y1="180" x2="440" y2="180" stroke="#444" stroke-width="2"/>
    <rect x="440" y="170" width="70" height="20" fill="#fff" stroke="#444" stroke-width="2"/><text x="475" y="164" text-anchor="middle">330-1k &#937;</text>
    <line x1="510" y1="180" x2="600" y2="180" stroke="#444" stroke-width="2"/>
    <circle cx="630" cy="180" r="22" fill="#f9a825"/><text x="670" y="169">LIGHT - lit while light relay is ON</text>

    <line x1="130" y1="245" x2="440" y2="245" stroke="#444" stroke-width="2"/>
    <rect x="440" y="235" width="70" height="20" fill="#fff" stroke="#444" stroke-width="2"/><text x="475" y="229" text-anchor="middle">330-1k &#937;</text>
    <line x1="510" y1="245" x2="600" y2="245" stroke="#444" stroke-width="2"/>
    <circle cx="630" cy="245" r="22" fill="#00acc1"/><text x="670" y="234">FAN - lit while fan relay is ON</text>

    <line x1="130" y1="310" x2="440" y2="310" stroke="#444" stroke-width="2"/>
    <rect x="440" y="300" width="70" height="20" fill="#fff" stroke="#444" stroke-width="2"/><text x="475" y="294" text-anchor="middle">330-1k &#937;</text>
    <line x1="510" y1="310" x2="600" y2="310" stroke="#444" stroke-width="2"/>
    <circle cx="630" cy="310" r="22" fill="#e53935" class="blink"/><text x="670" y="299">FAULT - fast blink: PIR stuck HIGH</text>
  </g>
  <!-- common ground -->
  <path d="M130 355 H915 V115" fill="none" stroke="#000" stroke-width="2.5"/>
  <g stroke="#000" stroke-width="2.5"><path d="M652 115 H915"/><path d="M652 180 H915"/><path d="M652 245 H915"/><path d="M652 310 H915"/></g>
  <text x="780" y="350" text-anchor="middle" font-size="12" fill="#000">common GND (all LED cathodes / short leg)</text>

  <rect x="20" y="400" width="960" height="55" rx="8" fill="#fff6d6" stroke="#b58900"/>
  <text x="35" y="422" font-size="13" fill="#6b4e00" font-weight="700">Notes:</text>
  <text x="90" y="422" font-size="13" fill="#6b4e00">LED long leg (anode) on the resistor side, short leg to GND &#183; a few mA each, no transistor needed &#183; place the resistor at the LED end of long wires</text>
  <text x="35" y="442" font-size="13" fill="#6b4e00">Low-voltage wires only - keep them away from the 230 V wiring inside the box. System heartbeat = on-board PC13 LED (no wiring needed).</text>
</svg>
