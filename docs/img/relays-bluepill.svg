<rect x="20" y="565" width="960" height="174" rx="8" fill="#fff6d6" stroke="#b58900" stroke-width="1"/>
<text x="35" y="587" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">Active LOW (RELAY_ACTIVE_LOW 1): pin goes LOW -&gt; PC-817 LED lights (5 V through R2 470 &#937;) -&gt; its transistor feeds the S8050 base through R1 2.2</text>
<text x="35" y="607" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">   k -&gt; relay pulls in.</text>
<text x="35" y="627" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">R3 10 k from the S8050 base to GND keeps the relay off while the Blue Pill boots. 1N4007 across the coil, bar to +5V. The 230 V side never touches</text>
<text x="35" y="647" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">   the Blue Pill.</text>
<text x="35" y="667" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">Contacts: COM = common (mains in), NO = closed while the relay is ON (lamp / fan), NC = closed while OFF. Stage as drawn in the AutoBath</text>
<text x="35" y="687" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">   schematic: bench test with NO mains first.</text>
<text x="35" y="707" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">A ready-made 2-channel relay module instead? IN1 -&gt; PA1, IN2 -&gt; PA2, VCC -&gt; 5V, GND -&gt; GND (see connections.svg).</text>
<text x="35" y="727" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">Mains wiring only by a qualified electrician; keep mains copper well away from the Blue Pill side.</text>
</svg>
