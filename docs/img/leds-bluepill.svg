<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 582" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<style>.blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }</style>
<rect width="1000" height="582" rx="14" fill="#f6f9ff" stroke="#c9d6ee"/>
<text x="500" y="32" font-size="20" font-weight="700" fill="#10264d" text-anchor="middle">All status LEDs: each LED to its own Blue Pill pin</text>
<rect x="20" y="55" width="360" height="420" rx="10" fill="none" stroke="#2a62c9" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="34" y="77" font-size="14" font-weight="700" fill="#2a62c9" text-anchor="start">INSIDE the plastic box</text>
<rect x="380" y="55" width="600" height="420" rx="10" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="394" y="77" font-size="14" font-weight="700" fill="#555" text-anchor="start">OUTSIDE (box lid / front panel)</text>
<rect x="40" y="90" width="150" height="370" rx="10" fill="#e3edff" stroke="#2a62c9" stroke-width="2"/>
<text x="52" y="114" font-size="15" font-weight="700" fill="#2a62c9" text-anchor="start">BLUE PILL</text>
<text x="52" y="132" font-size="12" font-weight="400" fill="#2a62c9" text-anchor="start">GD32F103C8T6</text>
<text x="52" y="448" font-size="11" font-weight="400" fill="#5a6f99" text-anchor="start">USB end at the top</text>
<rect x="186" y="110" width="104" height="30" rx="5" fill="#d81b60" stroke="#d81b60" stroke-width="1"/>
<text x="238" y="130" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">PA3 (A3)</text>
<line x1="290" y1="125" x2="480" y2="125" stroke="#444" stroke-width="2"/>
<rect x="480" y="115" width="70" height="20" rx="0" fill="#fff" stroke="#444" stroke-width="2"/>
<text x="515" y="109" font-size="12" font-weight="400" fill="#10264d" text-anchor="middle">330 &#937;</text>
<line x1="550" y1="125" x2="650" y2="125" stroke="#444" stroke-width="2"/>
<circle cx="670" cy="125" r="20" fill="#d81b60"/>
<text x="705" y="117" font-size="13" font-weight="400" fill="#10264d" text-anchor="start">PIR - lit while motion is seen</text>
<line x1="690" y1="125" x2="940" y2="125" stroke="#000" stroke-width="2.5"/>
<rect x="186" y="160" width="104" height="30" rx="5" fill="#f9a825" stroke="#f9a825" stroke-width="1"/>
<text x="238" y="180" font-size="14" font-weight="700" fill="#000" text-anchor="middle">PA4 (A4)</text>
<line x1="290" y1="175" x2="480" y2="175" stroke="#444" stroke-width="2"/>
<rect x="480" y="165" width="70" height="20" rx="0" fill="#fff" stroke="#444" stroke-width="2"/>
<text x="515" y="159" font-size="12" font-weight="400" fill="#10264d" text-anchor="middle">330 &#937;</text>
<line x1="550" y1="175" x2="650" y2="175" stroke="#444" stroke-width="2"/>
<circle cx="670" cy="175" r="20" fill="#f9a825"/>
<text x="705" y="167" font-size="13" font-weight="400" fill="#10264d" text-anchor="start">LIGHT - lit while the light relay is ON</text>
<line x1="690" y1="175" x2="940" y2="175" stroke="#000" stroke-width="2.5"/>
<rect x="186" y="210" width="104" height="30" rx="5" fill="#00acc1" stroke="#00acc1" stroke-width="1"/>
<text x="238" y="230" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">PA5 (A5)</text>
<line x1="290" y1="225" x2="480" y2="225" stroke="#444" stroke-width="2"/>
<rect x="480" y="215" width="70" height="20" rx="0" fill="#fff" stroke="#444" stroke-width="2"/>
<text x="515" y="209" font-size="12" font-weight="400" fill="#10264d" text-anchor="middle">330 &#937;</text>
<line x1="550" y1="225" x2="650" y2="225" stroke="#444" stroke-width="2"/>
<circle cx="670" cy="225" r="20" fill="#00acc1"/>
<text x="705" y="217" font-size="13" font-weight="400" fill="#10264d" text-anchor="start">FAN - lit while the fan relay is ON</text>
<line x1="690" y1="225" x2="940" y2="225" stroke="#000" stroke-width="2.5"/>
<rect x="186" y="260" width="104" height="30" rx="5" fill="#e53935" stroke="#e53935" stroke-width="1"/>
<text x="238" y="280" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">PA6 (A6)</text>
<line x1="290" y1="275" x2="480" y2="275" stroke="#444" stroke-width="2"/>
<rect x="480" y="265" width="70" height="20" rx="0" fill="#fff" stroke="#444" stroke-width="2"/>
<text x="515" y="259" font-size="12" font-weight="400" fill="#10264d" text-anchor="middle">330 &#937;</text>
<line x1="550" y1="275" x2="650" y2="275" stroke="#444" stroke-width="2"/>
<circle cx="670" cy="275" r="20" fill="#e53935" class="blink"/>
<text x="705" y="267" font-size="13" font-weight="400" fill="#10264d" text-anchor="start">FAULT (red) - fast blink: PIR stuck HIGH</text>
<line x1="690" y1="275" x2="940" y2="275" stroke="#000" stroke-width="2.5"/>
<rect x="186" y="310" width="104" height="30" rx="5" fill="#43a047" stroke="#43a047" stroke-width="1"/>
<text x="238" y="330" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">PB11 (B11)</text>
<line x1="290" y1="325" x2="480" y2="325" stroke="#444" stroke-width="2"/>
<rect x="480" y="315" width="70" height="20" rx="0" fill="#fff" stroke="#444" stroke-width="2"/>
<text x="515" y="309" font-size="12" font-weight="400" fill="#10264d" text-anchor="middle">330 &#937;</text>
<line x1="550" y1="325" x2="650" y2="325" stroke="#444" stroke-width="2"/>
<circle cx="670" cy="325" r="20" fill="#43a047"/>
<text x="705" y="317" font-size="13" font-weight="400" fill="#10264d" text-anchor="start">FAN-ENABLED - steady on: fan active</text>
<line x1="690" y1="325" x2="940" y2="325" stroke="#000" stroke-width="2.5"/>
<rect x="186" y="360" width="104" height="30" rx="5" fill="#7dffc4" stroke="#7dffc4" stroke-width="1"/>
<text x="238" y="380" font-size="14" font-weight="700" fill="#000" text-anchor="middle">PB13 (B13)</text>
<line x1="290" y1="375" x2="480" y2="375" stroke="#444" stroke-width="2"/>
<rect x="480" y="365" width="70" height="20" rx="0" fill="#fff" stroke="#444" stroke-width="2"/>
<text x="515" y="359" font-size="12" font-weight="400" fill="#10264d" text-anchor="middle">330 &#937;</text>
<line x1="550" y1="375" x2="650" y2="375" stroke="#444" stroke-width="2"/>
<circle cx="670" cy="375" r="20" fill="#7dffc4" class="blink"/>
<text x="705" y="367" font-size="13" font-weight="400" fill="#10264d" text-anchor="start">SYSTEM heartbeat - blinks once a second</text>
<line x1="690" y1="375" x2="940" y2="375" stroke="#000" stroke-width="2.5"/>
<polyline points="290,425 940,425 940,125" fill="none" stroke="#000" stroke-width="2.5"/>
<rect x="186" y="410" width="104" height="30" rx="5" fill="#000000" stroke="#000000" stroke-width="1"/>
<text x="238" y="430" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">GND</text>
<text x="615" y="417" font-size="12" font-weight="400" fill="#000" text-anchor="middle">one common GND wire to every LED short leg (cathode)</text>
<rect x="20" y="490" width="960" height="74" rx="8" fill="#fff6d6" stroke="#b58900" stroke-width="1"/>
<text x="35" y="512" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">LED long leg (anode) on the resistor side, short leg to GND. 330 &#937; for red/green/yellow (100 &#937; for blue/white). A few mA each, no transistor.</text>
<text x="35" y="532" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">Active HIGH: the pin goes HIGH to light the LED (STATUS_LED_ACTIVE_LOW 0). The board's own heartbeat LED is on PC13 (on-board, nothing to wire).</text>
<text x="35" y="552" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">Six external LEDs are wired. Turn them all off in firmware with ENABLE_STATUS_LEDS 0. Real pin positions on the board: pinout.svg.</text>
</svg>
