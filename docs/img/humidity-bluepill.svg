<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 477" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<style>.blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }</style>
<rect width="1000" height="477" rx="14" fill="#f6f9ff" stroke="#c9d6ee"/>
<text x="500" y="32" font-size="20" font-weight="700" fill="#10264d" text-anchor="middle">Optional humidity sensor DHT11 / DHT22 to the Blue Pill</text>
<rect x="20" y="55" width="960" height="270" rx="10" fill="none" stroke="#2a62c9" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="34" y="77" font-size="14" font-weight="700" fill="#2a62c9" text-anchor="start">Low voltage only (optional, HUMIDITY_ENABLE 1)</text>
<rect x="40" y="90" width="150" height="220" rx="10" fill="#e3edff" stroke="#2a62c9" stroke-width="2"/>
<text x="52" y="114" font-size="15" font-weight="700" fill="#2a62c9" text-anchor="start">BLUE PILL</text>
<text x="52" y="132" font-size="12" font-weight="400" fill="#2a62c9" text-anchor="start">GD32F103C8T6</text>
<text x="52" y="298" font-size="11" font-weight="400" fill="#5a6f99" text-anchor="start">USB end at the top</text>
<rect x="186" y="115" width="104" height="30" rx="5" fill="#ef6c00" stroke="#ef6c00" stroke-width="1"/>
<text x="238" y="135" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3V3</text>
<rect x="186" y="175" width="104" height="30" rx="5" fill="#00897b" stroke="#00897b" stroke-width="1"/>
<text x="238" y="195" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">PB12 (B12)</text>
<rect x="186" y="255" width="104" height="30" rx="5" fill="#000000" stroke="#000000" stroke-width="1"/>
<text x="238" y="275" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">GND</text>
<rect x="620" y="100" width="200" height="190" rx="8" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
<text x="745" y="135" font-size="15" font-weight="700" fill="#01579b" text-anchor="middle">DHT22 (AM2302)</text>
<text x="745" y="155" font-size="12" font-weight="400" fill="#01579b" text-anchor="middle">or DHT11 module</text>
<line x1="290" y1="130" x2="620" y2="130" stroke="#ef6c00" stroke-width="2.5"/>
<rect x="620" y="120" width="44" height="20" rx="3" fill="#fff" stroke="#444" stroke-width="1.5"/>
<text x="642" y="135" font-size="11" font-weight="700" fill="#10264d" text-anchor="middle">VCC</text>
<line x1="290" y1="190" x2="620" y2="190" stroke="#00897b" stroke-width="2.5"/>
<rect x="620" y="180" width="44" height="20" rx="3" fill="#fff" stroke="#444" stroke-width="1.5"/>
<text x="642" y="195" font-size="11" font-weight="700" fill="#10264d" text-anchor="middle">DATA</text>
<line x1="290" y1="270" x2="620" y2="270" stroke="#000" stroke-width="2.5"/>
<rect x="620" y="260" width="44" height="20" rx="3" fill="#fff" stroke="#444" stroke-width="1.5"/>
<text x="642" y="275" font-size="11" font-weight="700" fill="#10264d" text-anchor="middle">GND</text>
<line x1="500" y1="130" x2="500" y2="150" stroke="#ef6c00" stroke-width="2.5"/>
<rect x="490" y="150" width="20" height="22" rx="0" fill="#fff" stroke="#444" stroke-width="2"/>
<line x1="500" y1="172" x2="500" y2="190" stroke="#00897b" stroke-width="2.5"/>
<circle cx="500" cy="190" r="3.5" fill="#444"/>
<circle cx="500" cy="130" r="3.5" fill="#444"/>
<text x="520" y="166" font-size="12" font-weight="400" fill="#10264d" text-anchor="start">10 k pull-up</text>
<text x="405" y="122" font-size="12" font-weight="700" fill="#ef6c00" text-anchor="middle">3.3 V</text>
<text x="405" y="182" font-size="12" font-weight="700" fill="#00897b" text-anchor="middle">one-wire data</text>
<rect x="20" y="345" width="960" height="114" rx="8" fill="#fff6d6" stroke="#b58900" stroke-width="1"/>
<text x="35" y="367" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">Off by default (HUMIDITY_ENABLE 0). Set it to 1 and pick HUMIDITY_TYPE 11 (DHT11) or 22 (DHT22). Humid at 70 % RH or more starts the fan, normal</text>
<text x="35" y="387" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">   again at 62 % or less.</text>
<text x="35" y="407" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">The data line needs the 10 k pull-up to 3V3 (bare 4-pin sensors; many 3-pin modules already have it). A failing sensor lights the red FAULT LED</text>
<text x="35" y="427" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">   steady.</text>
<text x="35" y="447" font-size="13" font-weight="400" fill="#6b4e00" text-anchor="start">Real pin positions on the board: pinout.svg.</text>
</svg>
