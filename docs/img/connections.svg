<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1000" height="560" rx="14" fill="#f6f9ff" stroke="#c9d6ee"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#10264d">Connections at a glance (low-voltage side)</text>
  <text x="140" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#2a62c9">INPUTS</text>
  <text x="860" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#2a62c9">OUTPUTS</text>

  <!-- MCU -->
  <rect x="370" y="70" width="260" height="400" rx="10" fill="#fff" stroke="#10264d" stroke-width="2"/>
  <text x="500" y="96" text-anchor="middle" font-weight="700" font-size="17">GD32F103C8T6 board</text>
  <g font-size="14">
    <text x="384" y="120">PA0 (A0)</text>
    <text x="384" y="200">PB0 (B0)</text>
    <text x="384" y="280">PB1 (B1)</text>
    <text x="384" y="360">PB12 (optional)</text>
    <g text-anchor="end">
      <text x="616" y="120">PA1 (A1)</text>
      <text x="616" y="150">PA2 (A2)</text>
      <text x="616" y="200">PA3 (A3)</text>
      <text x="616" y="230">PA4 (A4)</text>
      <text x="616" y="260">PA5 (A5)</text>
      <text x="616" y="290">PA6 (A6)</text>
      <text x="616" y="320">PA7 (A7)</text>
    </g>
  </g>
  <text x="500" y="420" text-anchor="middle" font-size="12" fill="#666">PC13 = on-board system LED (heartbeat)</text>
  <text x="500" y="440" text-anchor="middle" font-size="12" fill="#666">SWD header (PA13/PA14) = ST-Link</text>
  <text x="500" y="458" text-anchor="middle" font-size="12" fill="#666">5V / GND / 3V3 from the board pins</text>

  <!-- inputs -->
  <g font-size="14" font-weight="700">
    <rect x="30" y="90" width="220" height="60" rx="8" fill="#fff" stroke="#1faa59" stroke-width="2"/>
    <text x="140" y="115" text-anchor="middle">PIR sensor OUT</text><text x="140" y="135" text-anchor="middle" font-size="12" font-weight="400" fill="#666">must be 3.3 V or less</text>
    <rect x="30" y="170" width="220" height="60" rx="8" fill="#fff" stroke="#6d4c41" stroke-width="2"/>
    <text x="140" y="195" text-anchor="middle">Light override button</text><text x="140" y="215" text-anchor="middle" font-size="12" font-weight="400" fill="#666">pin to GND</text>
    <rect x="30" y="250" width="220" height="60" rx="8" fill="#fff" stroke="#5d4037" stroke-width="2"/>
    <text x="140" y="275" text-anchor="middle">Fan enable/disable button</text><text x="140" y="295" text-anchor="middle" font-size="12" font-weight="400" fill="#666">pin to GND</text>
    <rect x="30" y="330" width="220" height="60" rx="8" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="140" y="355" text-anchor="middle">DHT11 / DHT22 (option)</text><text x="140" y="375" text-anchor="middle" font-size="12" font-weight="400" fill="#666">data + pull-up, 3.3 V supply</text>
  </g>
  <g fill="none" stroke-width="3">
    <path d="M250 115 H370" stroke="#1faa59"/>
    <path d="M250 200 H370" stroke="#6d4c41"/>
    <path d="M250 280 H370" stroke="#5d4037"/>
    <path d="M250 360 H370" stroke="#999" stroke-dasharray="6 4"/>
  </g>

  <!-- outputs -->
  <rect x="750" y="90" width="230" height="80" rx="8" fill="#fff" stroke="#10264d" stroke-width="2"/>
  <text x="865" y="112" text-anchor="middle" font-size="14" font-weight="700">2-channel relay module</text>
  <text x="765" y="132" font-size="13">IN1 = light   IN2 = fan</text>
  <text x="765" y="152" font-size="12" fill="#666">VCC 5 V, GND (logic side only)</text>
  <path d="M630 115 H750" fill="none" stroke="#e0a800" stroke-width="3"/>
  <path d="M630 145 H690 V150 H750" fill="none" stroke="#14a3b8" stroke-width="3"/>

  <rect x="750" y="190" width="230" height="150" rx="8" fill="#fff" stroke="#10264d" stroke-width="2"/>
  <text x="865" y="210" text-anchor="middle" font-size="14" font-weight="700">Status LEDs (outside the box)</text>
  <g font-size="13">
    <circle cx="775" cy="231" r="7" fill="#d81b60"/><text x="792" y="236">PIR (PA3)</text>
    <circle cx="775" cy="261" r="7" fill="#f9a825"/><text x="792" y="266">Light relay (PA4)</text>
    <circle cx="775" cy="291" r="7" fill="#00acc1"/><text x="792" y="296">Fan relay (PA5)</text>
    <circle cx="775" cy="321" r="7" fill="#e53935"/><text x="792" y="326">Fault (PA6)</text>
  </g>
  <path d="M630 200 H700 V231 H750" fill="none" stroke="#d81b60" stroke-width="2.5"/>
  <path d="M630 230 H690 V261 H750" fill="none" stroke="#f9a825" stroke-width="2.5"/>
  <path d="M630 260 H680 V291 H750" fill="none" stroke="#00acc1" stroke-width="2.5"/>
  <path d="M630 290 H670 V321 H750" fill="none" stroke="#e53935" stroke-width="2.5"/>

  <rect x="750" y="355" width="230" height="50" rx="8" fill="#fff" stroke="#43a047" stroke-width="2"/>
  <circle cx="775" cy="380" r="9" fill="#43a047"/>
  <text x="795" y="376" font-size="13" font-weight="700">FAN-ENABLED LED (PA7)</text>
  <text x="795" y="394" font-size="12" fill="#666">on = fan active, off = disabled</text>
  <path d="M630 320 H660 V380 H750" fill="none" stroke="#43a047" stroke-width="2.5"/>

  <!-- notes -->
  <rect x="30" y="415" width="310" height="125" rx="10" fill="#fff6d6" stroke="#b58900"/>
  <text x="45" y="440" font-size="14" font-weight="700" fill="#6b4e00">Check before powering:</text>
  <text x="45" y="462" font-size="13" fill="#6b4e00">&#8226; PIR OUT must be &#8804; 3.3 V (else divider)</text>
  <text x="45" y="482" font-size="13" fill="#6b4e00">&#8226; Relay polarity (config.h): bench test</text>
  <text x="45" y="502" font-size="13" fill="#6b4e00">&#8226; LEDs: GPIO &#8594; 330 &#937;-1 k&#937; &#8594; LED &#8594; GND</text>
  <text x="45" y="522" font-size="13" fill="#6b4e00">&#8226; No mains until all bench tests pass</text>

  <rect x="660" y="425" width="320" height="115" rx="10" fill="#fff" stroke="#c9d6ee"/>
  <text x="675" y="448" font-size="13" font-weight="700" fill="#10264d">Where the pins are (USB at top):</text>
  <text x="675" y="468" font-size="12" fill="#444">A0..A7, B0, B1: right header (A0 5th from bottom)</text>
  <text x="675" y="486" font-size="12" fill="#444">B12: left header, 1st from top</text>
  <text x="675" y="504" font-size="12" fill="#444">5V, GND, 3V3: left header, bottom 3 pins</text>
  <text x="675" y="522" font-size="12" fill="#444">Full drawing: docs/img/pinout.svg</text>
</svg>
