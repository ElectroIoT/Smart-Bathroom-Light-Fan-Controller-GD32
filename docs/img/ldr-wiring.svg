<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <style>
    .sun { animation: sun 2.4s ease-in-out infinite; transform-origin: 90px 120px; }
    @keyframes sun { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <rect width="1000" height="470" rx="14" fill="#f6f9ff" stroke="#c9d6ee"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#10264d">Optional daylight sensor (digital LDR module)</text>

  <!-- sun / window -->
  <circle class="sun" cx="90" cy="120" r="30" fill="#ffd54a"/>
  <g stroke="#ffd54a" stroke-width="4" class="sun">
    <line x1="90" y1="70" x2="90" y2="58"/><line x1="90" y1="170" x2="90" y2="182"/>
    <line x1="40" y1="120" x2="28" y2="120"/><line x1="140" y1="120" x2="152" y2="120"/>
  </g>
  <text x="90" y="215" text-anchor="middle" font-size="13" fill="#6b4e00" font-weight="700">window light</text>
  <path d="M130 120 H230" stroke="#ffd54a" stroke-width="3" stroke-dasharray="8 6" fill="none"/>

  <!-- LDR module -->
  <rect x="240" y="80" width="230" height="170" rx="10" fill="#fff" stroke="#10264d" stroke-width="2"/>
  <text x="355" y="108" text-anchor="middle" font-size="16" font-weight="700">LDR module (digital)</text>
  <text x="355" y="126" text-anchor="middle" font-size="12" fill="#666">4 pins + threshold dial</text>
  <g font-size="15">
    <text x="258" y="158">VCC</text><text x="258" y="184">GND</text><text x="258" y="210">DO (digital out)</text>
    <text x="258" y="236" fill="#999">AO (not used)</text>
  </g>

  <!-- board -->
  <rect x="650" y="80" width="300" height="170" rx="10" fill="#fff" stroke="#10264d" stroke-width="2"/>
  <text x="800" y="108" text-anchor="middle" font-size="16" font-weight="700">GD32 board</text>
  <g font-size="15" text-anchor="end">
    <text x="935" y="158">3V3 pin</text><text x="935" y="184">GND pin</text><text x="935" y="210">PB10 (B10)</text>
  </g>

  <g fill="none" stroke-width="3">
    <path d="M470 154 H650" stroke="#ef6c00"/>
    <path d="M470 180 H650" stroke="#222"/>
    <path d="M470 206 H650" stroke="#1faa59"/>
  </g>
  <text x="560" y="146" text-anchor="middle" font-size="12" fill="#ef6c00" font-weight="700">3.3 V</text>
  <text x="560" y="172" text-anchor="middle" font-size="12" fill="#222" font-weight="700">GND</text>
  <text x="560" y="198" text-anchor="middle" font-size="12" fill="#1faa59" font-weight="700">signal</text>

  <!-- behaviour -->
  <rect x="40" y="275" width="440" height="85" rx="10" fill="#fff" stroke="#c9d6ee"/>
  <text x="58" y="298" font-size="14" font-weight="700" fill="#10264d">What it does (DAYLIGHT_SENSOR = 1)</text>
  <text x="58" y="319" font-size="13" fill="#333">&#8226; Bright daylight: motion does NOT switch the light on.</text>
  <text x="58" y="337" font-size="13" fill="#333">&#8226; The fan still starts and runs on its normal timer.</text>
  <text x="58" y="355" font-size="13" fill="#333">&#8226; Override button: the light always turns on.</text>

  <rect x="500" y="275" width="460" height="85" rx="10" fill="#fff" stroke="#c9d6ee"/>
  <text x="518" y="298" font-size="14" font-weight="700" fill="#10264d">Settings (include/config.h)</text>
  <text x="518" y="319" font-size="13" fill="#333">&#8226; DAYLIGHT_SENSOR 1 turns it on (default 0 = off)</text>
  <text x="518" y="337" font-size="13" fill="#333">&#8226; DAYLIGHT_BRIGHT_LEVEL: 1 if DO is HIGH when bright, 0 if LOW</text>
  <text x="518" y="355" font-size="13" fill="#333">&#8226; DAYLIGHT_FILTER_MS: reading must hold 10 s (clouds)</text>

  <rect x="40" y="380" width="920" height="70" rx="10" fill="#fff6d6" stroke="#b58900"/>
  <text x="58" y="403" font-size="14" font-weight="700" fill="#6b4e00">Mounting</text>
  <text x="58" y="423" font-size="13" fill="#6b4e00">&#8226; Face the sensor at the window and shield it from the lamp (tube or hood) so the lamp cannot light it. Turn the dial until the module LED switches at your daylight level.</text>
  <text x="58" y="441" font-size="13" fill="#6b4e00">&#8226; Many modules output LOW in bright light: if the light never turns on by day or night, flip DAYLIGHT_BRIGHT_LEVEL. A disconnected sensor reads as dark, so the light keeps working.</text>
</svg>
